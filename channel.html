 <!DOCTYPE html>
<html>
<head>
  <title>TechHive - Channel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <div class="chat-app">
    <div class="chat-header">
      <a href="dashboard.html" class="back-link">← Back</a>
      <h2 id="title"></h2>
      <button id="logoutBtn">Logout</button>
    </div>

    <div id="messages"></div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const channel = new URLSearchParams(window.location.search).get('name') || 'General';
    const user = localStorage.getItem('regno');

    if (!user) {
      window.location.href = "index.html";
    }

    document.getElementById('title').textContent = '# ' + channel;
    socket.emit('join', channel);

    const messages = document.getElementById('messages');
    const input = document.getElementById('messageInput');

    function addMessage(sender, text) {
      const div = document.createElement('div');
      div.className = 'msg' + (sender === user ? ' own' : '');

      if (sender !== user) {
        const name = document.createElement('div');
        name.className = 'sender';
        name.textContent = sender;
        div.appendChild(name);
      }

      const body = document.createElement('div');
      body.textContent = text;
      div.appendChild(body);

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      div.appendChild(time);

      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    socket.on('message', ({ user: sender, text }) => addMessage(sender, text));

    function send() {
      if (input.value.trim() === '') return;
      socket.emit('message', { channel, user, text: input.value });
      input.value = '';
    }

    document.getElementById('sendBtn').addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });

    document.getElementById('logoutBtn').addEventListener('click', function() {
      localStorage.removeItem('regno');
      window.location.href = "index.html";
    });
  </script>
</body>
</html>
