<!DOCTYPE html>
<html>
<head>
  <title>TechHive - Channel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="chat-page">
  <div class="chat-app">
    <div class="chat-header">
      <a href="dashboard.html" class="back-link">← Back</a>
      <h2 id="title"></h2>
      <button id="logoutBtn">Logout</button>
    </div>

    <div id="messages"></div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." autocomplete="off">
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const user = localStorage.getItem('regno');
    const channel = new URLSearchParams(window.location.search).get('name') || 'General';

    if (!user) {
      window.location.href = "index.html";
    } else {
      const socket = io();
      const messages = document.getElementById('messages');
      const input = document.getElementById('messageInput');

      document.getElementById('title').textContent = '# ' + channel;

      // Join on every (re)connect; the server replies with saved history
      socket.on('connect', () => {
        socket.emit('join', channel);
      });

      function addMessage(sender, text, time) {
        const div = document.createElement('div');
        div.className = 'msg' + (sender === user ? ' own' : '');

        if (sender !== user) {
          const name = document.createElement('div');
          name.className = 'sender';
          name.textContent = sender;
          div.appendChild(name);
        }

        const body = document.createElement('div');
        body.textContent = text;
        div.appendChild(body);

        const stamp = document.createElement('div');
        stamp.className = 'time';
        stamp.textContent = new Date(time || Date.now()).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.appendChild(stamp);

        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      // Saved messages: clear first so a reconnect never duplicates them
      socket.on('history', (list) => {
        messages.innerHTML = '';
        list.forEach(m => addMessage(m.user, m.text, m.time));
      });

      socket.on('message', (m) => addMessage(m.user, m.text, m.time));

      function send() {
        const text = input.value.trim();
        if (text === '') return;
        socket.emit('message', { channel, user, text });
        input.value = '';
        input.focus();
      }

      document.getElementById('sendBtn').addEventListener('click', send);
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') send();
      });

      document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('regno');
        window.location.href = "index.html";
      });
    }
  </script>
</body>
</html>
