 <!DOCTYPE html>
<html>
<head>
  <title>TechHive - Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Welcome to TechHive</h1>
  <div id="userBar">
  <span>Logged in as <strong id="userName"></strong></span>
  <button id="logoutBtn">Logout</button>
</div>
  <h2>Announcements</h2>
  <ul id="announcements">
    <li>Mid-sem exams start next Monday</li>
    <li>Placement drive registration open</li>
  </ul>

  <h2>Study Channels</h2>
  <ul id="channels">
    <li><a href="channel.html?name=General lounge">General lounge</a></li>
    <li><a href="channel.html?name=DSA">DSA</a></li>
<li><a href="channel.html?name=OS">OS</a></li>
<li><a href="channel.html?name=git&github">git&github</a></li>
<li><a href="channel.html?name=find your studybuddy">find your studybuddy</a></li>
  </ul>
  <script>
  const regno = localStorage.getItem('regno');
  if (!regno) {
    window.location.href = "index.html";
  }
  document.getElementById('userName').textContent = regno;
  document.getElementById('logoutBtn').addEventListener('click', function() {
    localStorage.removeItem('regno');
    window.location.href = "index.html";
  });
</script>
</body>
</html>
